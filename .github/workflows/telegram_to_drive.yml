name: Telegram to Google Drive

on:
  schedule:
    - cron: "0 12 * * *"   # ⏰ كل يوم على الساعة 12:00 UTC (13:00 بتوقيت الجزائر)
  workflow_dispatch:        # ⬅️ لتشغيله يدويًا من GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon pydrive2 moviepy

      - name: ▶️ Run telegram_to_drive.py
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_SESSION_PATH: "./sessions/telegram.session"
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_FOLDER_ID: ${{ secrets.GOOGLE_FOLDER_ID }}
        run: |
          mkdir -p ./sessions
          python telegram_to_drive.py
