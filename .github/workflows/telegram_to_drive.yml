name: Telegram to Google Drive

on:
  schedule:
    - cron: '0 12 * * *'  # كل يوم على الساعة 12:00 UTC
  workflow_dispatch:

jobs:
  telegram-upload:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Restore Telegram session
        run: echo "${{ secrets.TELEGRAM_SESSION }}" | base64 -d > telegram.session

      - name: Install dependencies
        run: |
          echo "📂 Current path:"
          pwd
          echo "📂 Files in repo:"
          ls -R
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          echo "✅ Checking if moviepy is installed:"
          pip show moviepy || echo "moviepy not found"
          pip list | grep moviepy || echo "moviepy missing from list"

      - name: Debug Python paths
        run: |
          python -c "import sys; print('🔎 sys.path:', sys.path)"
          python -c "import importlib.util; print('🔎 moviepy spec:', importlib.util.find_spec('moviepy'))"
          python -c "import importlib.util; print('🔎 moviepy.editor spec:', importlib.util.find_spec('moviepy.editor'))"

      - name: Run Telegram to Drive
        run: python telegram_to_drive.py
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_FOLDER_ID: ${{ secrets.GOOGLE_FOLDER }}
